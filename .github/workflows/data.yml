name: Market data
run-name: Market data / ${{ inputs.mode == 'daily' && 'daily' || 'incremental-probe' }}
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [incremental-probe, daily]
        default: incremental-probe
      external_schedule:
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: market-data-single-writer
  cancel-in-progress: false
jobs:
  incremental:
    if: >-
      github.repository == 'seikoubon/japan-swing-market-data' &&
      github.ref == 'refs/heads/main' && github.actor == 'seikoubon' &&
      (inputs.mode == 'incremental-probe' ||
       (inputs.mode == 'daily' && vars.MARKET_DATA_WRITER_ENABLED == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: market-data
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065b # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.13.6
      - run: uv sync --locked --no-dev
      - name: Run and verify market data
        env:
          MARKET_MODE: ${{ inputs.mode }}
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
          SWING_S3_BUCKET: ${{ secrets.SWING_S3_BUCKET }}
          SWING_S3_ENDPOINT: ${{ secrets.SWING_S3_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          SWING_S3_PREFIX: japan-swing/v1
        run: uv run --no-sync python -m japan_swing_market.runner "$MARKET_MODE"
